# Prevents installation of packages newer than 7 days
# to mitigate supply chain risks
# - https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@upleveled/*'
  - eslint-config-upleveled
  - stylelint-config-upleveled
  # Renovate security update: next@16.1.5 || 16.2.3 || 16.2.6 || 16.2.11
  - next@16.1.5 || 16.2.3 || 16.2.6 || 16.2.11
  # Renovate security update: swiper@12.1.2
  - swiper@12.1.2
  # Renovate security update: postcss@8.5.10 || 8.5.18 || 8.5.23
  - postcss@8.5.10 || 8.5.18 || 8.5.23
  # Renovate security update: uuid@14.0.0
  - uuid@14.0.0
# Fail on pnpm ignored build scripts
# - https://pnpm.io/settings#strictdepbuilds
strictDepBuilds: true
allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
